
<!DOCTYPE html>
<html>
<head>
    <title>Inline CSS Table</title>
</head>
<body>

    <h2 style="text-align: center; color: blue;">
        Student Details
    </h2>

    <table style="width: 100%; border-collapse: collapse; text-align: center;">
        <tr style="background-color: lightblue;">
            <th style="border: 1px solid black; padding: 10px;">Roll No</th>
            <th style="border: 1px solid black; padding: 10px;">Name</th>
            <th style="border: 1px solid black; padding: 10px;">Marks</th>
        </tr>

        <tr>
            <td style="border: 1px solid black; padding: 10px;">101</td>
            <td style="border: 1px solid black; padding: 10px;">Ravi</td>
            <td style="border: 1px solid black; padding: 10px;">85</td>
        </tr>

        <tr>
            <td style="border: 1px solid black; padding: 10px;">102</td>
            <td style="border: 1px solid black; padding: 10px;">Sita</td>
            <td style="border: 1px solid black; padding: 10px;">90</td>
        </tr>
    </table>

</body>
</html>
